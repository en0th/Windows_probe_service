name: Build Windows probe EXE

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Optional release version, for example v1.2.1 (blank builds only)'
        required: false
        default: ''
        type: string

permissions:
  contents: read

jobs:
  windows-x64:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
          architecture: x64
          cache: pip
          cache-dependency-path: |
            windows_probe_service/requirements.txt
            windows_probe_service/requirements-dev.txt
            windows_probe_service/requirements-build.txt
      - name: Test, build and smoke the frozen Windows service
        shell: powershell
        run: .\windows_probe_service\Build.ps1
      - name: Upload verified standalone EXE
        uses: actions/upload-artifact@v7.0.2
        with:
          name: SOARProbe-Windows-x64
          path: |
            windows_probe_service/dist/SOARProbe.exe
            windows_probe_service/dist/SOARProbe-Windows-x64.zip
            windows_probe_service/dist/SOARProbe-Windows-x64-portable.zip
            windows_probe_service/dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

  release:
    if: ${{ inputs.release_tag != '' }}
    needs: windows-x64
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: probe-release-${{ inputs.release_tag }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/download-artifact@v8.0.2
        with:
          name: SOARProbe-Windows-x64
          path: dist
      - name: Verify and publish the Windows release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import ast
          import os
          from pathlib import Path
          tree = ast.parse(Path('windows_probe_service/service.py').read_text(encoding='utf-8'))
          version = next(ast.literal_eval(node.value) for node in tree.body
                         if isinstance(node, ast.Assign)
                         and any(isinstance(target, ast.Name) and target.id == 'SERVICE_VERSION' for target in node.targets))
          if os.environ['RELEASE_TAG'] != 'v' + version:
              raise SystemExit('Release tag must match the tested service version')
          PY
          (cd dist && sha256sum -c SHA256SUMS.txt)
          gh release create "$RELEASE_TAG" \
            dist/SOARProbe.exe dist/SOARProbe-Windows-x64.zip dist/SOARProbe-Windows-x64-portable.zip dist/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "SOARProbe $RELEASE_TAG · Windows x64" --notes-file RELEASE_NOTES.md --draft
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false
